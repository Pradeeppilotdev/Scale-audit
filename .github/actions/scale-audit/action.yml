name: Scale Audit
description: Static scale-readiness audit for Node/TS repos; comments findings on pull requests.
inputs:
  repo:
    description: Repo URL or local path to audit (defaults to the checked-out workspace).
    required: false
    default: ${{ github.workspace }}
  fail-on:
    description: Optional severity threshold to fail the action (critical|high|medium|low).
    required: false
    default: ""
  version:
    description: Version of @pradeeppilot/scale-audit to run.
    required: false
    default: "0.3.4"
  github-token:
    description: Token used to post the PR comment.
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Run scale-audit
      shell: bash
      env:
        INPUT_REPO: ${{ inputs.repo }}
        FAIL_ON: ${{ inputs.fail-on }}
        AUDIT_VERSION: ${{ inputs.version }}
      run: |
        REPO="$INPUT_REPO"
        if [ -z "$REPO" ]; then
          REPO="$GITHUB_WORKSPACE"
        fi
        ARGS=("$REPO" --format md --out scale-audit-report.md)
        if [ -n "$FAIL_ON" ]; then
          ARGS+=(--fail-on "$FAIL_ON")
        fi
        npx --yes "@pradeeppilot/scale-audit@$AUDIT_VERSION" "${ARGS[@]}"
    - name: Comment on PR
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        REPORT_FILE: scale-audit-report.md
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("fs");
          if (!fs.existsSync(process.env.REPORT_FILE)) return;
          const marker = "<!-- scale-audit-report -->";
          const body = marker + "\n" + fs.readFileSync(process.env.REPORT_FILE, "utf8").slice(0, 60000);
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
          const existing = comments.data.find((c) => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }
