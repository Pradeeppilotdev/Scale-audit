name: ci
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package requires the Oct 2026 security-patched Node lines.
        # Node 20 is EOL and no longer receives security fixes.
        node-version: ["^22.23.4", "^24.22.1", "^26.12.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
      - run: npm ci
      - run: npm test
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Never fall below the Oct 21, 2026 security floor.
          node-version: "^24.22.1"
          check-latest: true
      - run: npm ci
      - run: npm run build
      - name: Install the tarball and audit a request handler
        shell: bash
        run: |
          set -euo pipefail
          package_dir=$(mktemp -d "$RUNNER_TEMP/scale-package.XXXXXX")
          npm pack --pack-destination "$package_dir"
          npm install --prefix "$package_dir/install" --ignore-scripts --no-audit --no-fund "$package_dir"/*.tgz
          "$package_dir/install/node_modules/.bin/scale-audit" tests/fixtures/badapp --out "$package_dir/report.json"
          node - "$package_dir/report.json" <<'NODE'
          const assert = require('node:assert/strict');
          const report = require(process.argv[2]);
          assert.equal(report.analyzer.version, require('./package.json').version);
          assert.equal(report.complete, true);
          assert.ok(report.findings.some(f => f.id === 'sync-io' && f.severity === 'high'));
          NODE
      - name: Audit the pinned regression corpus
        shell: bash
        run: |
          set -euo pipefail
          corpus=$(mktemp -d "$RUNNER_TEMP/scale-corpus.XXXXXX")
          fetch_case() {
            local name="$1" remote="$2" revision
            revision=$(node -p "require('./tests/corpus/baseline.json')[process.argv[1]].commit" "$name")
            git init --bare --quiet "$corpus/$name.git"
            git -C "$corpus/$name.git" fetch --quiet --no-tags --depth=1 "$remote" "$revision"
          }
          fetch_case nanpolis https://github.com/Pradeeppilotdev/nanpolis.git
          fetch_case hono https://github.com/honojs/hono.git
          node tests/corpus/check.mjs "nanpolis=$corpus/nanpolis.git" "hono=$corpus/hono.git"
