name: ci
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package requires the Oct 2026 security-patched Node lines.
        # Node 20 is EOL and no longer receives security fixes.
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Security-patched release for the Oct 21, 2026 advisories.
          node-version: 24.22.1
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run
